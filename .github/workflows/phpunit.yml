name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-suggest -o

      - name: Prepare environment
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --ansi --no-interaction --force
          php artisan config:clear
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          php -r "echo getenv('APP_KEY') ? 'APP_KEY set' : 'APP_KEY missing';"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Build assets (Vite)
        run: |
          npm run build

      - name: Show build output and manifest
        run: |
          echo "Listing public/"
          ls -la public || true
          echo "Listing public/build/"
          ls -la public/build || true
          if [ -f public/build/manifest.json ]; then
            echo "manifest exists"
            echo "---- manifest head ----"
            head -n 30 public/build/manifest.json || true
            echo "---- end manifest ----"
          else
            echo "manifest missing"; exit 1
          fi

      - name: Run migrations and seed
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        run: vendor/bin/pest --testdox
